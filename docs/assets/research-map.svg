    <text x="250" y="355" text-anchor="middle" fill="#ffffff">A11</text>
    <circle cx="110" cy="210" r="26" fill="#0f766e"/>
    <text x="110" y="215" text-anchor="middle" fill="#ffffff">A12</text>
    <circle cx="250" cy="70" r="26" fill="#7c3aed"/>
    <text x="250" y="75" text-anchor="middle" fill="#ffffff">REV</text>
  </g>
  <path d="M546 201 C610 168 674 168 738 199" fill="none" stroke="#d49a33" stroke-width="3" stroke-linecap="round"/>
  <path d="M738 199 l-13 -3 l7 11 z" fill="#d49a33"/>
  <text x="642" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="13" fill="#6c4410">publish when ready</text>
